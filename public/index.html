<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sahay</title>
  <meta name="description" content="Accessible bank KYC help in Hindi, Marathi and English.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
  <script type="module" src="js/main.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="bar">
    <button id="back-btn" class="icon-btn" type="button" aria-label="Back" hidden></button>
    <a class="brand" href="#/" aria-label="Sahay home"><img src="icon.svg" alt="" width="30" height="30"><span>Sahay</span></a>
    <select id="lang-select" class="lang-pick" aria-label="Language">
      <option value="hi">हिन्दी</option>
      <option value="mr">मराठी</option>
      <option value="en">English</option>
    </select>
    <button id="menu-btn" class="icon-btn" type="button" aria-label="Menu" aria-haspopup="dialog"></button>
  </header>
  <main id="main" tabindex="-1"></main>
  <dialog id="menu" class="sheet" aria-label="Menu"><div class="sheet-body"><div class="sheet-grip"></div><div id="menu-items"></div></div></dialog>
  <div id="announcer" class="sr-only" aria-live="assertive" aria-atomic="true"></div>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
